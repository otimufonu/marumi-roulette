<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>今日の担当</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 30px 20px;
    background: #f3f3f3;
    color: #222;
    font-family: sans-serif;
}

.container {
    max-width: 600px;
    margin: 0 auto;
}

h1 {
    text-align: center;
    margin-bottom: 30px;
}

.card {
    background: white;
    border-radius: 12px;
    padding: 20px;
    margin-bottom: 20px;
    box-shadow: 0 2px 10px rgba(0,0,0,.06);
}

label {
    display: block;
    margin-bottom: 8px;
    font-weight: bold;
}

input,
select,
button {
    font-size: 16px;
}

input[type="date"] {
    width: 100%;
    padding: 12px;
    border: 1px solid #ccc;
    border-radius: 8px;
    background: white;
}

.staff-list {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
}

.staff-button {
    padding: 14px 10px;
    border: 1px solid #ccc;
    border-radius: 8px;
    background: white;
    cursor: pointer;
}

.staff-button.selected {
    background: #222;
    color: white;
    border-color: #222;
}

.main-button {
    width: 100%;
    padding: 15px;
    border: none;
    border-radius: 8px;
    background: #222;
    color: white;
    font-weight: bold;
    cursor: pointer;
}

.main-button:disabled {
    opacity: .4;
    cursor: default;
}

.small {
    color: #777;
    font-size: 13px;
}


/* =========================
   結果
========================= */

.result {
    text-align: center;
}

#rouletteText {
    font-size: 30px;
    font-weight: bold;
    margin: 40px 0;
}

.result-role {
    margin-bottom: 18px;
    padding: 16px;
    border-radius: 12px;
}

.result-role h2 {
    margin: 0 0 8px;
    font-size: 18px;
}

.result-name {
    font-size: 27px;
    font-weight: bold;
}

.role-hall {
    background: #dceeff;
    color: #12538a;
}

.role-service {
    background: #dff5df;
    color: #236b2b;
}

.role-wash {
    background: #fff0c9;
    color: #7b5700;
}

.role-combo {
    background: #f0defc;
    color: #713c94;
}


/* =========================
   管理画面
========================= */

.admin-section h2 {
    margin-top: 0;
}

.staff-admin {
    border-top: 1px solid #ddd;
    padding: 15px 0;
}

.staff-admin:first-child {
    border-top: none;
}

.hall-ability-row {
    display: grid;
    grid-template-columns: 70px 1fr;
    align-items: center;
    gap: 10px;
    margin-top: 12px;
}

.hall-ability-row input {
    width: 100%;
    padding: 8px;
    border: 1px solid #ccc;
    border-radius: 6px;
}

.hall-ability-label {
    font-weight: bold;
}


/* =========================
   実績割合
========================= */

.stats-person {
    border-top: 1px solid #ddd;
    padding: 18px 0;
}

.stats-person:first-child {
    border-top: none;
}

.stats-name {
    font-weight: bold;
    font-size: 18px;
    margin-bottom: 10px;
}

.stats-bar {
    height: 22px;
    display: flex;
    border-radius: 6px;
    overflow: hidden;
    margin-bottom: 8px;
    background: #eee;
}

.stats-h {
    background: #6eb5e8;
}

.stats-d {
    background: #78c77a;
}

.stats-w {
    background: #e8bf5b;
}

.stats-combo {
    background: #b88bd8;
}

.stats-text {
    font-size: 13px;
    line-height: 1.8;
}


/* =========================
   履歴
========================= */

details {
    border-top: 1px solid #ddd;
}

details:first-child {
    border-top: none;
}

summary {
    cursor: pointer;
    padding: 14px 4px;
    font-weight: bold;
}

.month-block {
    margin-left: 10px;
    margin-bottom: 5px;
}

.month-block summary {
    font-weight: normal;
}

.history-day {
    padding: 10px 8px;
    border-top: 1px solid #eee;
    font-size: 14px;
    line-height: 1.8;
}

.history-role-hall {
    color: #12538a;
}

.history-role-service {
    color: #236b2b;
}

.history-role-wash {
    color: #7b5700;
}

.history-role-combo {
    color: #713c94;
}

.hidden {
    display: none;
}


/* =========================
   隠し管理入口
========================= */

#secretArea {
    position: fixed;
    top: 0;
    right: 0;
    width: 70px;
    height: 70px;
}

.admin-link {
    display: none;
    position: fixed;
    top: 15px;
    right: 15px;
    padding: 8px 12px;
    background: #222;
    color: white;
    border-radius: 6px;
    text-decoration: none;
    font-size: 13px;
}
</style>
</head>

<body>

<div id="secretArea"></div>

<a href="#" id="adminLink" class="admin-link">
    管理者
</a>

<div class="container">


<!-- =========================
     通常画面
========================= -->

<section id="mainScreen">

    <h1>今日の担当</h1>

    <div class="card">

        <label for="workDate">
            日付
        </label>

        <input
            type="date"
            id="workDate"
        >

    </div>


    <div class="card">

        <label>
            今日の出勤者
        </label>

        <div
            id="staffList"
            class="staff-list">
        </div>

        <p class="small">
            3人以上を選択してください。
        </p>

    </div>


    <div class="card">

        <button
            id="setButton"
            class="main-button"
            disabled>
            セット
        </button>
        
        <button id="trialButton"
        class="main-button"
        disabled
        style="margin-top:10px;">
    お試し回し
</button>

    </div>

</section>


<!-- =========================
     ルーレット
========================= -->

<section
    id="rouletteScreen"
    class="hidden">

    <div class="card result">

        <h1>本日の配置</h1>

        <div id="rouletteText">
            抽選中……
        </div>

        <div id="resultArea"></div>

        <button
            id="backButton"
            class="main-button hidden">
            戻る
        </button>

    </div>

</section>


<!-- =========================
     管理画面
========================= -->

<section
    id="adminScreen"
    class="hidden">

    <h1>管理者ページ</h1>


    <!-- 能力設定 -->

    <div class="card admin-section">

        <h2>
            スタッフ設定
        </h2>

        <p class="small">
            ホール適性：数字が大きいほどホールに選ばれやすくなります。
        </p>

        <div id="adminStaffList"></div>

    </div>


    <!-- 実際の担当割合 -->

    <div class="card admin-section">

        <h2>
            実際の担当割合
        </h2>

        <div id="statsList"></div>

    </div>


    <!-- 履歴 -->

    <div class="card admin-section">

        <h2>
            担当履歴
        </h2>

        <div id="historyList"></div>

    </div>


    <div class="card">

        <button
            id="backToMain"
            class="main-button">
            通常画面へ戻る
        </button>

    </div>

</section>

</div>


<script>

/* =========================================================
   初期スタッフ
========================================================= */

const defaultStaff = [

    {
        id: 1,
        name: "こど",
        isNew: false,
        hallAbility: 90
    },

    {
        id: 2,
        name: "ゆた",
        isNew: false,
        hallAbility: 80
    },

    {
        id: 3,
        name: "いっ",
        isNew: false,
        hallAbility: 50
    },

    {
        id: 4,
        name: "しゅじ",
        isNew: false,
        hallAbility: 70
    },

    {
        id: 5,
        name: "ほの",
        isNew: true,
        hallAbility: 40
    },

    {
        id: 6,
        name: "じゅんど",
        isNew: true,
        hallAbility: 40
    },

    {
        id: 7,
        name: "よう",
        isNew: true,
        hallAbility: 40
    }

];


/* =========================================================
   スタッフデータ読み込み
========================================================= */

let staff =
    JSON.parse(
        localStorage.getItem("staffData")
    ) || defaultStaff;


/*
 * 古いデータとの互換処理。
 *
 * 以前の
 * ability.h
 * を持っている場合は、
 * それを hallAbility に移す。
 */

staff.forEach(person => {

    if (
        typeof person.hallAbility !== "number"
    ) {

        if (
            person.ability &&
            typeof person.ability.h === "number"
        ) {

            person.hallAbility =
                person.ability.h;

        } else {

            person.hallAbility = 50;

        }
    }


    if (
        typeof person.isNew !== "boolean"
    ) {
        person.isNew = false;
    }

});


/* =========================================================
   履歴
========================================================= */

let history =
    JSON.parse(
        localStorage.getItem(
            "assignmentHistory"
        )
    ) || [];
localStorage.removeItem("assignmentHistory");
location.reload();

let selectedStaff = [];


/* =========================================================
   初期化
========================================================= */

const dateInput =
    document.getElementById(
        "workDate"
    );


const today = new Date();

const yyyy =
    today.getFullYear();

const mm =
    String(
        today.getMonth() + 1
    ).padStart(2, "0");

const dd =
    String(
        today.getDate()
    ).padStart(2, "0");


dateInput.value =
    `${yyyy}-${mm}-${dd}`;


renderStaffList();


/* =========================================================
   スタッフ選択
========================================================= */

function renderStaffList() {

    const area =
        document.getElementById(
            "staffList"
        );

    area.innerHTML = "";


    staff.forEach(person => {

        const button =
            document.createElement(
                "button"
            );


        button.className =
            "staff-button";


        button.textContent =
            person.name;


        button.onclick = () => {

            if (
                selectedStaff.includes(
                    person.id
                )
            ) {

                selectedStaff =
                    selectedStaff.filter(
                        id =>
                            id !== person.id
                    );

                button.classList.remove(
                    "selected"
                );

            } else {

                selectedStaff.push(
                    person.id
                );

                button.classList.add(
                    "selected"
                );
            }


            updateSetButton();
        };


        area.appendChild(
            button
        );

    });

}


function updateSetButton() {

    const enabled =
        selectedStaff.length >= 3;

    document.getElementById("setButton")
        .disabled = !enabled;

    document.getElementById("trialButton")
        .disabled = !enabled;
}


/* =========================================================
   セット
========================================================= */

document.getElementById(
    "setButton"
).onclick = () => {

    document.getElementById(
        "mainScreen"
    ).classList.add("hidden");


    document.getElementById(
        "rouletteScreen"
    ).classList.remove("hidden");


    runRoulette(true);

};

document.getElementById("trialButton")
    .onclick = () => {

        document.getElementById("mainScreen")
            .classList.add("hidden");

        document.getElementById("rouletteScreen")
            .classList.remove("hidden");

        runRoulette(false);
    };


/* =========================================================
   ホール用・重み付き抽選
========================================================= */

function weightedHallRandom(
    candidates
) {

    const weighted = [];


    candidates.forEach(person => {

        let weight =
            Number(
                person.hallAbility
            );


        /*
         * 直近3回のホール担当回数
         */

        const recentCount =
            countRecentAssignments(
                person.id,
                "hall"
            );


        if (recentCount === 1) {
            weight *= 0.65;
        }


        if (recentCount >= 2) {
            weight *= 0.35;
        }


        /*
         * 前回もホールだった場合
         */

        const last =
            getLastAssignment(
                person.id
            );


        if (
            last &&
            last.role === "hall"
        ) {

            weight *= 0.5;

        }


        weighted.push({
            person,
            weight
        });

    });


    const total =
        weighted.reduce(
            (sum, item) =>
                sum + item.weight,
            0
        );


    /*
     * 全員の適性が0だった場合
     */

    if (total <= 0) {

        return candidates[
            Math.floor(
                Math.random()
                * candidates.length
            )
        ];

    }


    let random =
        Math.random() * total;


    for (
        const item of weighted
    ) {

        random -= item.weight;


        if (random <= 0) {

            return item.person;

        }

    }


    return weighted[
        weighted.length - 1
    ].person;

}


/* =========================================================
   通常抽選
   拭き・ドリンク、洗い場は
   能力値を使わず均等抽選
========================================================= */

function randomPerson(
    candidates
) {

    return candidates[
        Math.floor(
            Math.random()
            * candidates.length
        )
    ];

}


/* =========================================================
   最近の担当回数
========================================================= */

function countRecentAssignments(
    personId,
    role
) {

    const recent =
        history.slice(-3);


    return recent.filter(
        day => {

            return day.assignments.some(
                assignment =>

                    assignment.personId
                    === personId &&

                    assignment.role
                    === role
            );

        }
    ).length;

}


/* =========================================================
   最後の担当
========================================================= */

function getLastAssignment(
    personId
) {

    for (
        let i =
            history.length - 1;

        i >= 0;

        i--
    ) {

        const found =
            history[i].assignments.find(
                assignment =>
                    assignment.personId
                    === personId
            );


        if (found) {

            return found;

        }

    }


    return null;

}


/* =========================================================
   ホール候補
========================================================= */

function getHallCandidates(
    available,
    selectedHall
) {

    /*
     * すでに新人を1人ホールに
     * 選んでいる場合、
     * 2人目はベテラン優先。
     */

    const hasNewHall =
        selectedHall.some(
            person =>
                person.isNew
        );


    if (!hasNewHall) {

        return available;

    }


    const experienced =
        available.filter(
            person =>
                !person.isNew
        );


    /*
     * ベテランが残っているなら
     * 新人を2人目のホール候補から除外。
     */

    if (
        experienced.length > 0
    ) {

        return experienced;

    }


    return available;

}


/* =========================================================
   配置決定
========================================================= */

function createAssignment() {

    let available =
        staff.filter(
            person =>
                selectedStaff.includes(
                    person.id
                )
        );


    const assignments = [];


    /*
     * ============================================
     * 3人の場合
     * ============================================
     *
     * 今まで通り
     * ホール2人
     * 残り1人が拭き・ドリンク＋洗い場
     */

    if (
        available.length === 3
    ) {

        const selectedHall = [];


        for (
            let i = 0;
            i < 2;
            i++
        ) {

            const hallCandidates =
                getHallCandidates(
                    available,
                    selectedHall
                );


            const person =
                weightedHallRandom(
                    hallCandidates
                );


            assignments.push({

                personId:
                    person.id,

                personName:
                    person.name,

                role:
                    "hall"

            });


            selectedHall.push(
                person
            );


            available =
                available.filter(
                    p =>
                        p.id !==
                        person.id
                );

        }


        const person =
            available[0];


        assignments.push({

            personId:
                person.id,

            personName:
                person.name,

            role:
                "combo"

        });


        return assignments;

    }


    /*
     * ============================================
     * 4人の場合
     * ============================================
     */

    if (
        available.length === 4
    ) {

        const veterans =
            available.filter(
                person =>
                    !person.isNew
            );


        const newcomers =
            available.filter(
                person =>
                    person.isNew
            );


        /*
         * ----------------------------------------
         * ベテラン2人＋新人2人
         *
         * ホール：新人1＋ベテラン1
         * ドリンク：ベテラン1
         * 洗い場：新人1
         * ----------------------------------------
         */

        if (
            veterans.length === 2 &&
            newcomers.length === 2
        ) {

            /*
             * 新人2人のうち1人を
             * ホールへ
             */
            const newHall =
                randomPerson(
                    newcomers
                );


            assignments.push({

                personId:
                    newHall.id,

                personName:
                    newHall.name,

                role:
                    "hall"

            });


            const remainingNewcomers =
                newcomers.filter(
                    person =>
                        person.id !==
                        newHall.id
                );


            /*
             * ベテラン2人のうち1人を
             * ホールへ
             *
             * ホール適性を使う
             */
            const veteranHall =
                weightedHallRandom(
                    veterans
                );


            assignments.push({

                personId:
                    veteranHall.id,

                personName:
                    veteranHall.name,

                role:
                    "hall"

            });


            const remainingVeterans =
                veterans.filter(
                    person =>
                        person.id !==
                        veteranHall.id
                );


            /*
             * 残ったベテラン → ドリンク
             */
            const servicePerson =
                remainingVeterans[0];


            assignments.push({

                personId:
                    servicePerson.id,

                personName:
                    servicePerson.name,

                role:
                    "service"

            });


            /*
             * 残った新人 → 洗い場
             */
            const washPerson =
                remainingNewcomers[0];


            assignments.push({

                personId:
                    washPerson.id,

                personName:
                    washPerson.name,

                role:
                    "wash"

            });


            return assignments;

        }


        /*
         * ----------------------------------------
         * ベテラン3人＋新人1人
         *
         * ホール：ベテラン2
         * ドリンク：新人1
         * 洗い場：ベテラン1
         * ----------------------------------------
         */

        if (
            veterans.length === 3 &&
            newcomers.length === 1
        ) {

            /*
             * ベテランから
             * ホール2人を適性抽選
             */

            const hallCandidates =
                [...veterans];


            for (
                let i = 0;
                i < 2;
                i++
            ) {

                const person =
                    weightedHallRandom(
                        hallCandidates
                    );


                assignments.push({

                    personId:
                        person.id,

                    personName:
                        person.name,

                    role:
                        "hall"

                });


                const index =
                    hallCandidates.findIndex(
                        p =>
                            p.id ===
                            person.id
                    );


                hallCandidates.splice(
                    index,
                    1
                );

            }


            /*
             * 新人 → ドリンク
             */
            const servicePerson =
                newcomers[0];


            assignments.push({

                personId:
                    servicePerson.id,

                personName:
                    servicePerson.name,

                role:
                    "service"

            });


            /*
             * 残ったベテラン → 洗い場
             */
            const washPerson =
                hallCandidates[0];


            assignments.push({

                personId:
                    washPerson.id,

                personName:
                    washPerson.name,

                role:
                    "wash"

            });


            return assignments;

        }

    }


    /*
     * ============================================
     * 4人以上の通常処理
     *
     * 特殊ルールに該当しない場合はこちら
     * ============================================
     */

    const selectedHall = [];


    /*
     * ホール2人
     */

    for (
        let i = 0;
        i < 2;
        i++
    ) {

        const hallCandidates =
            getHallCandidates(
                available,
                selectedHall
            );


        const person =
            weightedHallRandom(
                hallCandidates
            );


        assignments.push({

            personId:
                person.id,

            personName:
                person.name,

            role:
                "hall"

        });


        selectedHall.push(
            person
        );


        available =
            available.filter(
                p =>
                    p.id !==
                    person.id
            );

    }


    /*
     * 拭き・ドリンク
     */

    const servicePerson =
        randomPerson(
            available
        );


    assignments.push({

        personId:
            servicePerson.id,

        personName:
            servicePerson.name,

        role:
            "service"

    });


    available =
        available.filter(
            p =>
                p.id !==
                servicePerson.id
        );


    /*
     * 洗い場
     */

    if (
        available.length > 0
    ) {

        const washPerson =
            randomPerson(
                available
            );


        assignments.push({

            personId:
                washPerson.id,

            personName:
                washPerson.name,

            role:
                "wash"

        });

    }


    return assignments;

}


/* =========================================================
   ルーレット
========================================================= */

function runRoulette(saveHistory) {

    const text =
        document.getElementById(
            "rouletteText"
        );


    const resultArea =
        document.getElementById(
            "resultArea"
        );


    const backButton =
        document.getElementById(
            "backButton"
        );


    resultArea.innerHTML = "";


    backButton.classList.add(
        "hidden"
    );


    let count = 0;


    const timer =
        setInterval(
            () => {

                const random =
                    staff[
                        Math.floor(
                            Math.random()
                            * staff.length
                        )
                    ];


                text.textContent =
                    random.name;


                count++;


                if (
                    count >= 20
                ) {

                    clearInterval(
                        timer
                    );


                    const assignments =
                        createAssignment();


                    showResult(
                        assignments
                    );


                    if (saveHistory) {
    saveResult(assignments);
}


                    backButton.classList.remove(
                        "hidden"
                    );

                }

            },
            80
        );

}


/* =========================================================
   結果表示
========================================================= */

function showResult(
    assignments
) {

    const text =
        document.getElementById(
            "rouletteText"
        );


    text.textContent =
        "決定！";


    const resultArea =
        document.getElementById(
            "resultArea"
        );


    resultArea.innerHTML = "";


    const roleInfo = {

        hall: {
            label: "ホール",
            className: "role-hall"
        },

        service: {
            label: "拭き・ドリンク",
            className: "role-service"
        },

        wash: {
            label: "洗い場",
            className: "role-wash"
        },

        combo: {
            label:
                "拭き・ドリンク＋洗い場",
            className:
                "role-combo"
        }

    };


    Object.keys(
        roleInfo
    ).forEach(
        role => {

            const people =
                assignments.filter(
                    item =>
                        item.role ===
                        role
                );


            if (
                people.length === 0
            ) {
                return;
            }


            const div =
                document.createElement(
                    "div"
                );


            div.className =
                `result-role ${roleInfo[role].className}`;


            div.innerHTML = `

                <h2>
                    ${roleInfo[role].label}
                </h2>

                <div class="result-name">

                    ${people
                        .map(
                            p =>
                                p.personName
                        )
                        .join("・")}

                </div>

            `;


            resultArea.appendChild(
                div
            );

        }
    );

}

) {

    const record = {

    history.push(

    );


    localStorage.setItem(

        JSON.stringify(
            history

}

/* =========================================================
   スタッフ設定
========================================================= */

function renderAbilitySettings() {

    const area =
        document.getElementById(
            "adminStaffList"
        );


    area.innerHTML = "";


    staff.forEach(
        person => {

            const div =
                document.createElement(
                    "div"
                );


            div.className =
                "staff-admin";


            div.innerHTML = `

                <strong>
                    ${person.name}
                </strong>


                <label
                    style="
                        display:flex;
                        align-items:center;
                        gap:8px;
                        margin-top:10px;
                        font-weight:normal;
                    "
                >

                    <input
                        type="checkbox"
                        class="new-staff-checkbox"
                        data-id="${person.id}"
                        ${person.isNew
                            ? "checked"
                            : ""}
                    >

                    新人

                </label>


                <div
                    class="hall-ability-row"
                >

                    <div
                        class="hall-ability-label"
                    >
                        ホール
                    </div>

                    <input
                        type="number"
                        min="0"
                        max="100"
                        value="${person.hallAbility}"
                        data-id="${person.id}"
                    >

                </div>

            `;


            area.appendChild(
                div
            );

        }
    );


    /* =====================================================
       ホール適性
    ===================================================== */

    area.querySelectorAll(
        ".hall-ability-row input"
    ).forEach(
        input => {

            input.addEventListener(
                "change",
                () => {

                    const id =
                        Number(
                            input.dataset.id
                        );


                    let value =
                        Number(
                            input.value
                        );


                    if (
                        Number.isNaN(
                            value
                        )
                    ) {

                        value = 0;

                    }


                    value =
                        Math.max(
                            0,
                            Math.min(
                                100,
                                value
                            )
                        );


                    input.value =
                        value;


                    const person =
                        staff.find(
                            p =>
                                p.id ===
                                id
                        );


                    if (
                        !person
                    ) {
                        return;
                    }


                    person.hallAbility =
                        value;


                    localStorage.setItem(
                        "staffData",
                        JSON.stringify(
                            staff
                        )
                    );

                }
            );

        }
    );


    /* =====================================================
       新人設定
    ===================================================== */

    area.querySelectorAll(
        ".new-staff-checkbox"
    ).forEach(
        input => {

            input.addEventListener(
                "change",
                () => {

                    const id =
                        Number(
                            input.dataset.id
                        );


                    const person =
                        staff.find(
                            p =>
                                p.id ===
                                id
                        );


                    if (
                        !person
                    ) {
                        return;
                    }


                    person.isNew =
                        input.checked;


                    localStorage.setItem(
                        "staffData",
                        JSON.stringify(
                            staff
                        )
                    );

                }
            );

        }
    );

}


/* =========================================================
   実際の担当割合
========================================================= */

function renderStats() {

    const area =
        document.getElementById(
            "statsList"
        );


    area.innerHTML = "";


    staff.forEach(
        person => {

            let h = 0;
            let d = 0;
            let w = 0;
            let combo = 0;


            history.forEach(
                day => {

                    day.assignments.forEach(
                        assignment => {

                            if (
                                assignment.personId
                                !== person.id
                            ) {
                                return;
                            }


                            if (
                                assignment.role
                                === "hall"
                            ) {
                                h++;
                            }


                            if (
                                assignment.role
                                === "service"
                            ) {
                                d++;
                            }


                            if (
                                assignment.role
                                === "wash"
                            ) {
                                w++;
                            }


                            if (
                                assignment.role
                                === "combo"
                            ) {
                                combo++;
                            }

                        }
                    );

                }
            );


            const total =
                h + d + w + combo;


            if (
                total === 0
            ) {

                const empty =
                    document.createElement(
                        "div"
                    );


                empty.className =
                    "stats-person";


                empty.innerHTML = `

                    <div
                        class="stats-name"
                    >
                        ${person.name}
                    </div>

                    <div class="small">
                        まだ担当履歴がありません
                    </div>

                `;


                area.appendChild(
                    empty
                );


                return;

            }


            const hp =
                h / total * 100;

            const dp =
                d / total * 100;

            const wp =
                w / total * 100;

            const cp =
                combo / total * 100;


            const div =
                document.createElement(
                    "div"
                );


            div.className =
                "stats-person";


            div.innerHTML = `

                <div
                    class="stats-name"
                >
                    ${person.name}
                </div>


                <div
                    class="stats-bar"
                >

                    <div
                        class="stats-h"
                        style="width:${hp}%">
                    </div>

                    <div
                        class="stats-d"
                        style="width:${dp}%">
                    </div>

                    <div
                        class="stats-w"
                        style="width:${wp}%">
                    </div>

                    <div
                        class="stats-combo"
                        style="width:${cp}%">
                    </div>

                </div>


                <div
                    class="stats-text"
                >

                    h：${h}回
                    （${hp.toFixed(1)}%）

                    ／

                    d：${d}回
                    （${dp.toFixed(1)}%）

                    ／

                    w：${w}回
                    （${wp.toFixed(1)}%）

                    ／

                    d+w：${combo}回
                    （${cp.toFixed(1)}%）

                </div>

            `;


            area.appendChild(
                div
            );

        }
    );

}


/* =========================================================
   年・月ごとの履歴
========================================================= */

function renderHistory() {

    const area =
        document.getElementById(
            "historyList"
        );


    area.innerHTML = "";


    if (
        history.length === 0
    ) {

        area.innerHTML =
            `<p class="small">
                まだ履歴がありません。
            </p>`;

        return;

    }


    const grouped = {};


    history.forEach(
        day => {

            const [
                year,
                month
            ] =
                day.date.split("-");


            if (
                !grouped[year]
            ) {
                grouped[year] = {};
            }


            if (
                !grouped[year][month]
            ) {
                grouped[year][month] = [];
            }


            grouped[year][month].push(
                day
            );

        }
    );


    const years =
        Object.keys(
            grouped
        )
        .sort()
        .reverse();


    years.forEach(
        year => {

            const yearDetails =
                document.createElement(
                    "details"
                );


            const yearSummary =
                document.createElement(
                    "summary"
                );


            yearSummary.textContent =
                `${year}年`;


            yearDetails.appendChild(
                yearSummary
            );


            const months =
                Object.keys(
                    grouped[year]
                )
                .sort()
                .reverse();


            months.forEach(
                month => {

                    const monthDetails =
                        document.createElement(
                            "details"
                        );


                    monthDetails.className =
                        "month-block";


                    const monthSummary =
                        document.createElement(
                            "summary"
                        );


                    monthSummary.textContent =
                        `${Number(month)}月`;


                    monthDetails.appendChild(
                        monthSummary
                    );


                    const days =
                        grouped[year][month]
                        .slice()
                        .sort(
                            (a, b) =>
                                b.date.localeCompare(
                                    a.date
                                )
                        );


                    days.forEach(
                        day => {

                            const div =
                                document.createElement(
                                    "div"
                                );


                            div.className =
                                "history-day";


                            const hall =
                                day.assignments
                                .filter(
                                    a =>
                                        a.role
                                        === "hall"
                                )
                                .map(
                                    a =>
                                        a.personName
                                )
                                .join("・");


                            const service =
                                day.assignments
                                .filter(
                                    a =>
                                        a.role
                                        === "service"
                                )
                                .map(
                                    a =>
                                        a.personName
                                )
                                .join("・");


                            const wash =
                                day.assignments
                                .filter(
                                    a =>
                                        a.role
                                        === "wash"
                                )
                                .map(
                                    a =>
                                        a.personName
                                )
                                .join("・");


                            const combo =
                                day.assignments
                                .filter(
                                    a =>
                                        a.role
                                        === "combo"
                                )
                                .map(
                                    a =>
                                        a.personName
                                )
                                .join("・");


                            div.innerHTML = `

                                <strong>
                                    ${day.date}
                                </strong>

                                <br>

                                <span
                                    class="history-role-hall"
                                >
                                    ホール：
                                    ${hall || "-"}
                                </span>

                                <br>

                                <span
                                    class="history-role-service"
                                >
                                    拭き・ドリンク：
                                    ${service || "-"}
                                </span>

                                <br>

                                <span
                                    class="history-role-wash"
                                >
                                    洗い場：
                                    ${wash || "-"}
                                </span>

                                ${
                                    combo
                                    ? `
                                    <br>

                                    <span
                                        class="history-role-combo"
                                    >
                                        拭き・ドリンク＋洗い場：
                                        ${combo}
                                    </span>
                                    `
                                    : ""
                                }

                            `;


                            monthDetails.appendChild(
                                div
                            );

                        }
                    );


                    yearDetails.appendChild(
                        monthDetails
                    );

                }
            );


            area.appendChild(
                yearDetails
            );

        }
    );

}
